<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>媽媽溝通程式</title>

<style>

:root{
  --teal-deep:#173f37;
  --teal:#1f5a4d;
  --teal-light:#e8f3f0;
  --cream:#faf6ee;
  --card-border:#ddd3bd;
  --ink:#26241f;
  --danger:#c1352b;
  --danger-bg:#fdeceb;
  --ok:#1f7a4d;
  --ok-bg:#e9f7ee;
  --radius-lg:20px;
  --radius-md:16px;
  --radius-sm:12px;
  --shadow:0 3px 10px rgba(30,25,15,.08);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
  background:var(--cream);
  color:var(--ink);
  -webkit-text-size-adjust:100%;
}

button{
  font:inherit;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  cursor:pointer;
  transition:
    transform .08s ease,
    background-color .12s ease,
    box-shadow .12s ease;
}

button:active{
  transform:scale(.95);
}

#app{
  height:100dvh;
  display:flex;
  flex-direction:column;
  max-width:900px;
  margin:auto;
}


/* ================= 上方 ================= */

#top{
  flex:none;
  background:var(--teal-deep);
  color:white;
  padding:10px 14px 8px;
}

#sentence{
  background:var(--teal);
  border-radius:var(--radius-md);
  padding:8px 14px;
  min-height:52px;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.06);
}

#sentence small{
  display:block;
  font-size:14px;
  opacity:.85;
  font-weight:700;
  letter-spacing:.02em;
}

#sentenceText{
  font-size:27px;
  font-weight:800;
  line-height:1.25;
  min-height:30px;
  word-break:break-word;
  margin-top:2px;
}


/* ================= 快速回答 ================= */

#quick{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:8px;
}

.quick{
  border:0;
  border-radius:var(--radius-md);
  background:white;
  color:var(--ink);
  min-height:62px;
  font-size:21px;
  font-weight:900;
  box-shadow:var(--shadow);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:2px;
  line-height:1.2;
  padding:4px 2px;
}

.quick .emoji{
  font-size:25px;
  line-height:1;
}

.quick[data-instant="對"]{
  background:var(--ok-bg);
  color:var(--ok);
}

.quick[data-instant="不是／不會"]{
  background:#fff7e8;
  color:#8a5b00;
}

.quick[data-instant="叫護理師"]{
  background:var(--danger);
  color:white;
}


/* ================= 上一步／清除 ================= */

#tools{
  flex:none;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  padding:8px 14px;
  background:#f0e9da;
  border-bottom:2px solid var(--card-border);
}

.tool{
  border:2px solid var(--card-border);
  border-radius:var(--radius-md);
  min-height:50px;
  background:white;
  font-size:21px;
  font-weight:900;
  box-shadow:var(--shadow);
}


/* ================= 主畫面 ================= */

#main{
  flex:1;
  min-height:0;
  padding:10px 14px;
  overflow:hidden;
}

.screen{
  height:100%;
  display:none;
  flex-direction:column;
  min-height:0;
}

.screen.active{
  display:flex;
}

.title{
  text-align:center;
  font-size:29px;
  font-weight:900;
  margin:2px 0 10px;
}


/* ================= 首頁 ================= */

.homeGrid{
  flex:1;
  min-height:0;

  display:grid;
  grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(3,1fr);

  gap:10px;
}

.cardHome{
  border:2px solid var(--card-border);
  border-radius:var(--radius-lg);
  background:white;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:6px;

  font-size:25px;
  font-weight:900;

  box-shadow:var(--shadow);
}

.cardHome .emoji{
  font-size:42px;
  line-height:1;
}


/* ================= 次頁 ================= */

.subtop{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:10px;
  flex:none;
}

.back{
  border:2px solid var(--teal-deep);
  border-radius:var(--radius-md);
  background:white;
  color:var(--teal-deep);

  padding:9px 14px;

  font-size:19px;
  font-weight:900;

  white-space:nowrap;

  box-shadow:var(--shadow);
}

.subtop h2{
  margin:0;
  font-size:26px;
  line-height:1.25;
  font-weight:900;
}


/* ================= 分類 ================= */

.categoryGrid{
  flex:1;
  min-height:0;

  display:grid;
  grid-template-columns:repeat(2,1fr);

  gap:10px;
}

.category{
  border:2px solid var(--card-border);
  border-radius:var(--radius-lg);
  background:white;

  font-size:25px;
  font-weight:900;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:6px;

  box-shadow:var(--shadow);

  padding:8px;
}

.category .emoji{
  font-size:37px;
}


/* ================= 第二層 ================= */

.grid{
  flex:1;
  min-height:0;

  display:grid;
  grid-template-columns:repeat(2,1fr);

  grid-auto-rows:minmax(88px,1fr);

  gap:10px;

  overflow:hidden;

  align-content:start;

  padding-bottom:4px;
}

.item{
  border:2px solid var(--card-border);
  border-radius:var(--radius-md);

  background:white;

  font-size:21px;
  font-weight:800;

  line-height:1.25;

  padding:8px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:5px;

  box-shadow:var(--shadow);

  text-align:center;
}

.item .emoji{
  font-size:29px;
  line-height:1;
}


/* ================= 家人 ================= */

.personGrid{
  flex:1;
  min-height:0;

  display:grid;

  grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(3,1fr);

  gap:10px;
}

.person{
  border:2px solid var(--card-border);
  border-radius:var(--radius-lg);

  background:white;

  font-size:25px;
  font-weight:900;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:8px;

  box-shadow:var(--shadow);
}


/* ================= 自己組句子 ================= */

.composeWrap{
  display:flex;
  flex-direction:column;

  min-height:0;
  flex:1;

  overflow:hidden;
}

.composeGrid{
  flex:1;
  min-height:0;

  display:grid;

  grid-template-columns:repeat(2,1fr);

  grid-template-rows:repeat(3,1fr);

  gap:8px;
}

.composeCat{
  min-height:0;

  border:2px solid var(--card-border);
  border-radius:var(--radius-md);

  background:white;

  padding:6px;

  box-shadow:var(--shadow);

  display:flex;
  flex-direction:column;
}

.composeCat h3{
  font-size:18px;

  margin:0 0 5px;

  text-align:center;

  line-height:1.1;

  font-weight:900;

  color:var(--teal-deep);
}

.composeItems{
  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:5px;

  flex:1;

  min-height:0;
}

.composeItems button{
  border:2px solid var(--card-border);

  border-radius:10px;

  background:var(--teal-light);

  color:var(--ink);

  min-height:38px;

  font-size:17px;

  font-weight:800;

  padding:3px;
}

.composeCat:nth-child(5){
  grid-column:1 / -1;
}

.composeCat:nth-child(5) .composeItems{
  grid-template-columns:repeat(4,1fr);
}


/* ================= 手寫 ================= */

#handScreen{
  flex:1;
  min-height:0;

  display:flex;
  flex-direction:column;

  position:relative;
}

#canvasWrap{
  flex:1;
  min-height:0;

  background:white;

  border:2px solid #b9b0a0;

  border-radius:var(--radius-lg);

  overflow:hidden;

  box-shadow:var(--shadow);
}

canvas{
  width:100%;
  height:100%;

  display:block;

  touch-action:none;
}

.handClear{
  position:absolute;

  right:0;
  top:-2px;

  z-index:2;

  border:2px solid var(--teal-deep);

  border-radius:var(--radius-sm);

  background:white;

  color:var(--teal-deep);

  padding:8px 13px;

  font-size:18px;

  font-weight:900;

  box-shadow:var(--shadow);
}

.handTitle{
  margin-right:110px;
}


/* ================= 矮手機 ================= */

@media(max-height:700px){

  #top{
    padding:7px 12px 7px;
  }

  #sentence{
    min-height:43px;
    padding:5px 11px;
  }

  #sentence small{
    font-size:12px;
  }

  #sentenceText{
    font-size:21px;
    min-height:23px;
  }

  #quick{
    margin-top:6px;
  }

  .quick{
    min-height:51px;
    font-size:18px;
  }

  .quick .emoji{
    font-size:21px;
  }

  #tools{
    padding:6px 12px;
  }

  .tool{
    min-height:43px;
    font-size:18px;
  }

  #main{
    padding:7px 12px;
  }

  .title{
    font-size:24px;
    margin-bottom:7px;
  }

  .cardHome{
    font-size:21px;
  }

  .cardHome .emoji{
    font-size:34px;
  }

  .back{
    font-size:17px;
    padding:7px 11px;
  }

  .subtop h2{
    font-size:22px;
  }

  .category{
    font-size:21px;
  }

  .category .emoji{
    font-size:30px;
  }

  .item{
    font-size:18px;
  }

  .item .emoji{
    font-size:25px;
  }

  .grid{
    grid-auto-rows:minmax(70px,1fr);
  }

  .person{
    font-size:20px;
  }

  .composeCat h3{
    font-size:15px;
  }

  .composeItems button{
    font-size:14px;
    min-height:34px;
  }

  .handClear{
    font-size:15px;
    padding:6px 9px;
  }
}


/* ================= 很窄手機 ================= */

@media(max-width:390px){

  .quick{
    font-size:16px;
  }

  .quick .emoji{
    font-size:19px;
  }

  .cardHome{
    font-size:19px;
  }

  .category{
    font-size:19px;
  }

  .item{
    font-size:17px;
  }

  .person{
    font-size:18px;
  }

  .composeItems button{
    font-size:13px;
  }
}

</style>
</head>


<body>

<div id="app">


<!-- ================= 上方 ================= -->

<header id="top">

  <div id="sentence">

    <small>
      媽媽想說的是
    </small>

    <div id="sentenceText">
      請點選下面的選項
    </div>

  </div>


  <!-- ================= 快速回答 ================= -->

  <div id="quick">

    <button
      class="quick"
      data-instant="對"
    >
      <span class="emoji">✅</span>
      對
    </button>


    <button
      class="quick"
      data-instant="不是／不會"
    >
      <span class="emoji">❌</span>
      不是／不會
    </button>


    <button
      class="quick"
      data-instant="叫護理師"
    >
      <span class="emoji">👩‍⚕️</span>

</header>


<!-- ================= 工具 ================= -->

<div id="tools">

  <button
    class="tool"
    id="undo"
  >

  <button
    class="tool"

  >
    🗑️ 清除
  </button>

</div>


<main id="main">


<!-- ================= 首頁 ================= -->

<section
  class="screen active"
  id="home"
>

  <h1 class="title">
    媽媽想說什麼？
  </h1>


  <div class="homeGrid">


    <button
      class="cardHome"
      data-go="family"
    >

      <span class="emoji">
        👨‍👩‍👧‍👦
      </span>

      家人

    </button>


    <button
      class="cardHome"
      data-go="me"
    >

      <span class="emoji">

      </span>

    <button

</section>


<!-- ================= 家人第一層 ================= -->

<section

>

    <h2>

  <div class="personGrid">


    <button

    >
      👨‍👩‍👧 其他家人
    </button>


  </div>

</section>


<!-- ================= 家人第二層 ================= -->

<section

>

  <div class="subtop">

    <button class="back">
      ← 返回首頁
    </button>

    <h2 id="familyTitle">
      家人
    </h2>

  </div>


  <div
    class="grid"
    id="familyGrid"
  ></div>

</section>


<!-- ================= 我第一層 ================= -->

<section
  class="screen"

>

  <div class="subtop">

    <button class="back">
      ← 返回首頁
    </button>

    <h2>

  <div class="categoryGrid">

<section

</section>


<!-- ================= 手寫 ================= -->

<section
  class="screen"
  id="hand"
>

  <div class="subtop">

    <button class="back">
      ← 返回首頁
    </button>

    <h2 class="handTitle">
      ✍️ 手寫
    </h2>

  </div>

    <button
      class="handClear"
      id="erase"

    <div id="canvasWrap">

      <canvas id="canvas"></canvas>

    </div>

  </div>

</section>


</main>

<script>


/* =========================================================
   畫面切換
========================================================= */

const screens =
  document.querySelectorAll(".screen");


function show(id){

  screens.forEach(screen=>{

    screen.classList.toggle(
      "active",
      screen.id === id
    );

  });


  if(id === "hand"){

    setTimeout(
      resizeCanvas,
      30
    );

  }

}


/* =========================================================
   組句子
========================================================= */

const sentence = [];

const text =
  document.getElementById(
    "sentenceText"
  );


function render(){

  text.textContent =
    sentence.length
      ? sentence.join(" ")
      : "請點選下面的選項";

}


function add(value){

  if(!value){
    return;
  }

  sentence.push(value);

  render();

}


/* =========================================================
   即時回答
========================================================= */

/*
  對
  不是／不會
  叫護理師

  功能：

  ① 顯示在最上方
  ② 播放語音
  ③ 不加入 sentence
  ④ 不會一直重複堆疊
  ⑤ 點另一個即時回答會直接替換
*/

function instant(value){

  /*
    直接取代上方顯示文字
    不修改 sentence
  */

  text.textContent = value;


  /*
    播放語音
  */

  if(
    "speechSynthesis" in window
  ){

    speechSynthesis.cancel();

    const utterance =
      new SpeechSynthesisUtterance(
        value
      );

    utterance.lang = "zh-TW";

    utterance.rate = 0.85;

    speechSynthesis.speak(
      utterance
    );

  }

}

/* =========================================================
   手寫
========================================================= */

const canvas =
  document.getElementById(
    "canvas"
  );


const ctx =
  canvas.getContext(
    "2d"
  );


function resizeCanvas(){

  const rect =
    canvas.getBoundingClientRect();


  const dpr =
    window.devicePixelRatio || 1;


  if(
    !rect.width ||
    !rect.height
  ){

    return;

  }


  canvas.width =
    Math.round(
      rect.width * dpr
    );


  canvas.height =
    Math.round(
      rect.height * dpr
    );


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  ctx.lineWidth = 6;

  ctx.lineCap = "round";

  ctx.lineJoin = "round";

  ctx.strokeStyle = "#222";

}


let drawing = false;


let last = {
  x:0,
  y:0
};


function getPosition(event){

  const rect =
    canvas.getBoundingClientRect();


  const touch =
    event.touches
      ? event.touches[0]
      : event;


  return {

    x:
      touch.clientX -
      rect.left,

    y:
      touch.clientY -
      rect.top

  };

}


function startDrawing(event){

  drawing = true;


  last =
    getPosition(
      event
    );


  event.preventDefault();

}


function draw(event){

  if(!drawing){

    return;

  }


  const position =
    getPosition(
      event
    );


  ctx.beginPath();


  ctx.moveTo(
    last.x,
    last.y
  );


  ctx.lineTo(
    position.x,
    position.y
  );


  ctx.stroke();


  last =
    position;


  event.preventDefault();

}


/* ================= 滑鼠 ================= */

canvas.addEventListener(
  "mousedown",
  startDrawing
);


canvas.addEventListener(
  "mousemove",
  draw
);


window.addEventListener(
  "mouseup",
  ()=>{
    drawing = false;
  }
);


/* ================= 手機觸控 ================= */

canvas.addEventListener(
  "touchstart",
  startDrawing,
  {
    passive:false
  }
);


canvas.addEventListener(
  "touchmove",
  draw,
  {
    passive:false
  }
);


canvas.addEventListener(
  "touchend",
  ()=>{
    drawing = false;
  }
);


/* =========================================================
   清除手寫
========================================================= */

document.getElementById(
  "erase"
).onclick = ()=>{

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

};

  }

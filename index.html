<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>媽媽溝通程式｜手寫預覽</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
  background:#f7f7f7;
  color:#222
}

body{overflow:hidden}

button{
  font-family:inherit;
  cursor:pointer
}

#app{
  height:100dvh;
  display:flex;
  flex-direction:column
}

/* ===== 上方組句區 ===== */
.sentence{
  position:sticky;
  top:0;
  z-index:100;
  flex:0 0 auto;
  background:white;
  border-bottom:2px solid #ddd;
  padding:12px;
  min-height:105px;
  display:flex;
  flex-direction:column;
  gap:8px
}

.sentence-text{
  min-height:45px;
  font-size:27px;
  font-weight:700;
  line-height:1.35;
  overflow:auto;
  padding:3px 5px
}

.controls{
  display:flex;
  gap:8px
}

.controls button{
  flex:1;
  min-height:48px;
  border:0;
  border-radius:12px;
  background:#e9e9e9;
  font-size:20px;
  font-weight:700
}

/* ===== 內容區 ===== */
.content{
  flex:1;
  overflow:auto;
  padding:18px
}

.page{
  display:none
}

.page.active{
  display:block
}

/* ===== 上方返回列 ===== */
.topbar{
  position:sticky;
  top:0;
  z-index:5;
  background:#f7f7f7;
  display:flex;
  align-items:center;
  gap:12px;
  padding-bottom:14px
}

.topbar button{
  min-width:110px;
  min-height:58px;
  border:0;
  border-radius:14px;
  background:#222;
  color:#fff;
  font-size:25px;
  font-weight:700
}

.page-title{
  font-size:29px;
  font-weight:800
}

/* ===== 正方形選項 ===== */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px
}

.card{
  aspect-ratio:1 / 1;
  width:100%;
  min-height:0;
  border:2px solid #bbb;
  border-radius:18px;
  background:white;
  font-size:clamp(26px,5vw,38px);
  font-weight:800;
  padding:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center
}

/* ===== 詞語選項 ===== */
.phrase{
  aspect-ratio:1 / 1;
  width:100%;
  min-height:0;
  margin-bottom:12px;
  border:2px solid #bbb;
  border-radius:16px;
  background:white;
  font-size:clamp(26px,5vw,38px);
  font-weight:700;
  text-align:center;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:center
}

.section-label{
  font-size:22px;
  font-weight:800;
  margin:4px 0 12px
}

.card:active,
.phrase:active,
.controls button:active,
.topbar button:active{
  transform:scale(.98)
}

/* ===== 手寫 ===== */
.handwriting-wrap{
  width:100%;
  padding:4px 0 20px
}

#handwritingCanvas{
  display:block;
  width:100%;
  height:60vh;
  min-height:420px;
  background:#fff;
  border:3px solid #333;
  border-radius:16px;
  touch-action:none;
  box-sizing:border-box
}

.handwriting-buttons{
  margin-top:16px
}

.handwriting-buttons button{
  width:100%;
  min-height:70px;
  font-size:28px;
  font-weight:800;
  border:0;
  border-radius:16px;
  background:#e9e9e9
}

.note{
  font-size:19px;
  color:#555;
  margin:0 0 12px
}

/* ===== 手機版 ===== */
@media(max-width:500px){

  .grid{
    grid-template-columns:1fr 1fr;
    gap:12px
  }

  .card{
    font-size:28px;
    padding:10px
  }

  .phrase{
    font-size:28px;
    padding:10px
  }

  .sentence-text{
    font-size:25px
  }

  .topbar button{
    min-width:100px;
    font-size:23px
  }

  .page-title{
    font-size:27px
  }
}

/* ===== 選項按鈕強制正方形 ===== */
.options-grid button,
.option-btn,
.choice-btn,
.category-btn{
  aspect-ratio:1 / 1 !important;
  width:100% !important;
  min-height:0 !important;
  font-size:clamp(24px,5vw,38px) !important;
  font-weight:700 !important;
  padding:12px !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  text-align:center !important
}

.options-grid{
  grid-auto-rows:1fr
}

@media(max-width:600px){
  .options-grid{
    gap:12px !important
  }
}
</style>
</head>

/* =========================================================
   HTML 防護
========================================================= */

function escapeHTML(s){

  return s.replace(
    /[&<>"']/g,

    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );

}


/* =========================================================
   頁面渲染
========================================================= */

function render(pageKey,push=true){

  if(push && currentPage!==pageKey){
    pageStack.push(currentPage);
  }

  currentPage=pageKey;

  const content=document.getElementById("content");


  /* ---------- 手寫 ---------- */

  if(pageKey==="handwriting"){

    content.innerHTML=`

      <div class="page active">

        <div class="topbar">

          <button onclick="goBack()">
            ← 返回
          </button>

          <div class="page-title">
            手寫
          </div>

        </div>


        <div class="handwriting-wrap">

          <p class="note">
            直接用手指在白色區域寫字
          </p>

          <canvas
            id="handwritingCanvas"
            width="800"
            height="600">
          </canvas>


          <div class="handwriting-buttons">

            <button onclick="clearHandwriting()">
              🗑️ 清除
            </button>

          </div>

        </div>

      </div>
    `;


    handwritingInitialized=false;

    setTimeout(initHandwriting,50);

    return;
  }


  let data=pages[pageKey] || lists[pageKey];


  /* ---------- 單一詞語 ---------- */

  if(!data){

    const [type,phrase]=pageKey.split(":");

    if(type==="phrase"){

      addPhrase(phrase);

      return;
    }
  }


  let html=`

    <div class="page active">

      ${
        pageKey!=="home"

        ?

        `
        <div class="topbar">

          <button onclick="goBack()">
            ← 返回
          </button>

          <div class="page-title">
            ${escapeHTML(data.title)}
          </div>

        </div>
        `

        :

        `
        <div class="topbar">

          <div class="page-title">
            媽媽溝通程式
          </div>

        </div>
        `
      }

      <div class="grid">
  `;


  /* ---------- 分類卡片 ---------- */

  if(data.cards){

    data.cards.forEach(([label,target])=>{

      html+=`

        <button
          class="card"
          onclick="handleTarget('${target}')">

          ${escapeHTML(label)}

        </button>

      `;

    });

  }


  /* ---------- 詞語 ---------- */

  else if(data.phrases){

    html=`

      <div class="page active">

        <div class="topbar">

          <button onclick="goBack()">
            ← 返回
          </button>

          <div class="page-title">
            ${escapeHTML(data.title)}
          </div>

        </div>

        <div>
    `;


    data.phrases.forEach(p=>{

      html+=`

        <button
          class="phrase"
          onclick='addPhrase(${JSON.stringify(p)})'>

          ${escapeHTML(p)}

        </button>

      `;

    });


    html+=`

        </div>

      </div>
    `;
  }


  html+=`

      </div>

    </div>
  `;


  content.innerHTML=html;

}


/* =========================================================
   點擊分類
========================================================= */

function handleTarget(target){

  if(target==="handwriting"){

    render("handwriting");

    return;
  }


  if(target.startsWith("phrase:")){

    addPhrase(target.slice(7));

    return;
  }


  render(target);

}


/* =========================================================
   加入句子
========================================================= */

function addPhrase(text){

  if(
    text===undefined ||
    text===null ||
    text===""
  ){

    return;
  }


  selected.push(String(text));

  updateSentence();

}


/* =========================================================
   更新上方句子
========================================================= */

function updateSentence(){

  const el=document.getElementById("sentenceText");

  if(!el)return;


  if(selected.length){

    el.textContent=selected.join(" ");

  }

  else{

    el.textContent="🗣️ 目前還沒有選擇";

  }


  el.scrollTop=el.scrollHeight;

}


/* =========================================================
   上一步
========================================================= */

function undo(){

  if(selected.length){

    selected.pop();

  }

  updateSentence();

}


/* =========================================================
   清除
========================================================= */

function clearSentence(){

  selected=[];

  updateSentence();

}


/* =========================================================
   語音
========================================================= */

function speakSentence(){

  if(!selected.length)return;

  speechSynthesis.cancel();


  const u=new SpeechSynthesisUtterance(
    selected.join(" ")
  );


  u.lang="zh-TW";

  u.rate=0.85;

  speechSynthesis.speak(u);

}


/* =========================================================
   返回上一層
========================================================= */

function goBack(){

  const prev=pageStack.pop();


  if(prev){

    render(prev,false);

  }

  else{

    render("home",false);

  }

}


/* =========================================================
   手寫功能
========================================================= */

let handwritingCanvas=null;
let handwritingCtx=null;
let isDrawing=false;
let handwritingInitialized=false;


/* ---------- 初始化 ---------- */

function initHandwriting(){

  handwritingCanvas=
    document.getElementById("handwritingCanvas");


  if(!handwritingCanvas)return;


  if(handwritingInitialized)return;


  handwritingInitialized=true;


  handwritingCtx=
    handwritingCanvas.getContext("2d");


  handwritingCtx.lineCap="round";

  handwritingCtx.lineJoin="round";


  /* 滑鼠 */

  handwritingCanvas.addEventListener(
    "mousedown",
    startDrawing
  );

  handwritingCanvas.addEventListener(
    "mousemove",
    draw
  );

  handwritingCanvas.addEventListener(
    "mouseup",
    stopDrawing
  );

  handwritingCanvas.addEventListener(
    "mouseout",
    stopDrawing
  );


  /* 手機 */

  handwritingCanvas.addEventListener(
    "touchstart",
    startDrawing,
    {passive:false}
  );

  handwritingCanvas.addEventListener(
    "touchmove",
    draw,
    {passive:false}
  );

  handwritingCanvas.addEventListener(
    "touchend",
    stopDrawing
  );

}


/* ---------- 取得觸控位置 ---------- */

function getPos(e){

  const rect=
    handwritingCanvas.getBoundingClientRect();


  const clientX=e.touches
    ? e.touches[0].clientX
    : e.clientX;


  const clientY=e.touches
    ? e.touches[0].clientY
    : e.clientY;


  return{

    x:
      (clientX-rect.left)
      *
      (
        handwritingCanvas.width/
        rect.width
      ),

    y:
      (clientY-rect.top)
      *
      (
        handwritingCanvas.height/
        rect.height
      )

  };

}


/* ---------- 開始畫 ---------- */

function startDrawing(e){

  e.preventDefault();

  isDrawing=true;


  handwritingCtx.beginPath();


  const pos=getPos(e);


  handwritingCtx.moveTo(
    pos.x,
    pos.y
  );


  handwritingCtx.strokeStyle="#000000";

  handwritingCtx.lineWidth=6;

}


/* ---------- 畫線 ---------- */

function draw(e){

  if(!isDrawing)return;


  e.preventDefault();


  const pos=getPos(e);


  handwritingCtx.lineTo(
    pos.x,
    pos.y
  );


  handwritingCtx.stroke();

}


/* ---------- 結束 ---------- */

function stopDrawing(){

  isDrawing=false;


  if(handwritingCtx){

    handwritingCtx.closePath();

  }

}


/* ---------- 清除手寫 ---------- */

function clearHandwriting(){

  if(
    !handwritingCanvas ||
    !handwritingCtx
  ){

    return;
  }


  handwritingCtx.clearRect(
    0,
    0,
    handwritingCanvas.width,
    handwritingCanvas.height
  );

}


/* =========================================================
   啟動程式
========================================================= */

render("home",false);

</script>
